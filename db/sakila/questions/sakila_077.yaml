category: [extra,aggregate,sqljoin]
database: sakila
question: Wich are the most expensive films.
js_ref: |
  var result=[]
  var result_films=[]
   var x=0;
    data.films.map(
      film => {
      if (result.length==0){
           result.push(film.Replacement_Cost)
           result_films.push(film.Title)
       }
        else
        {
             if (result[0]<film.Replacement_Cost)
             {
                 result=[film.Replacement_Cost]
                 result_films=[film.Title]
             }
             else if (result[0]==film.Replacement_Cost)
             {
                result.push(film.Replacement_Cost)
                result_films.push(film.Title)     
             }
        }   
       }
    )
  result=result_films;
sql_ref: |
     select title from film
     where 
     replacement_cost =
     (select max(replacement_cost) from film) 
