category: [extra,filter,projection]
database: sakila
question:  What is the proportion (as a percentage) of film rentals occurring at or after 12 p.m.?
js_ref: |  
   var total_before_12=0;
   var total_after_12=0;
   let midday=1000 * 60 * 60 * 12
   data.customers.map((customer) => {
      customer.Rentals.map(rental=>{
          {
              var rt=rental.Return_Date;
              var ru=rental.Rental_Date;
              if ( ru>'')
              { 
                 let dto=new Date(ru);
                 var hours= dto.getHours()
                 if (hours<12.0)
                 {
                    total_before_12+=1
                 }
                 else
                 {  
                    total_after_12+=1
                 }
              }
          }
      })
   });
   result=total_after_12*1.0/(total_before_12+total_after_12)*100.0;

sql_ref: |
   select (
   select count(*) from rental
   where not rental_date is null 
   and time(rental_date)>time('12:00:00')
   )*100.0/
   (
   select count(*) from rental
   where not rental_date is null 
   ) as portion_afternoon 
