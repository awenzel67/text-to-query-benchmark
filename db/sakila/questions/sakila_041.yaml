category: [none,aggregate,groupby,sqljoin]
database: sakila
question: Give me the anaual revenues auf movie 'YENTL BERLIN'.
js_ref: |  
      let result={};
      data.customers.map(customer=>{
         customer.Rentals.map(rental=>{
            if (rental.filmId && rental.Film_Title =='YENTL BERLIN') {
               rental.Payments.map(payment=>{
                   let amount=payment.Amount;
                   let datatime= new Date(payment.Payment_Date);
                   let year=datatime.getFullYear();
                   if (!(year in result)) {
                        result[year]=0;
                  }
                  result[year]+=amount;
               });
            }
         });
      });
            
sql_ref: |
   select STRFTIME('%Y', payment.payment_date) as year,sum(payment.amount) as total_revenue from 
   payment join
   rental on rental.rental_id=payment.rental_id join
   inventory on rental.inventory_id = inventory.inventory_id join
   film on inventory.film_id=film.film_id
   where film.title='YENTL BERLIN'
   group by year
