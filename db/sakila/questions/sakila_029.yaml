category: [none,aggregate,groupby,sqljoin]
database: sakila
question: How many films are in the inventory at adresses 'Dietzgenstraße 46'?
js_ref: |
    let result={};
    data.stores.map(store=>{
       if (store.Address=='Dietzgenstraße 46')
       {
       result[store.Address]=store.Inventory.length
       }
    });
sql_ref: |
    select 
    max(address.address),
    count(*)
    from store join inventory on inventory.store_id = store.store_id join address on address.address_id=store.address_id
    where address.address='Dietzgenstraße 46'
    group by store.store_id     