category: [none,filter]
question: In wich description of a film the word 'Bollenpieper' occurs?
js_ref: |  
    let result=data.films.filter(film=>film.Description.includes('Bollenpieper'))
    .map(film=>{return film.Title})
sql_ref: |
    select title from film
    where description like '%Bollenpieper%'; 