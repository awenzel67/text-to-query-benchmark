category: [extra,filter,projection]
database: sakila
question: What is the percentage of films that were returned the next day?
js_ref: |  
   var sum_days=0.0;
   var count=0;
   data.customers.map((customer) => {
      customer.Rentals.map(rental=>{
          {
              var rt=rental.Return_Date;
              var ru=rental.Rental_Date;
              count+=1;
              if (rt>'' && ru>'')
              { 
                 let dfrom=new Date(ru);
                 dfrom.setHours(0,0,0,0)
                 let dto=new Date(rt);
                 dto.setHours(0,0,0,0)
                 var days= (dto.getTime() - dfrom.getTime()) / 1000/60/60/24;
                 if (days==1)
                 {
                     sum_days+=days;
                 }
              }
          }
      })
   });
   result=sum_days*100.0/count;
            
sql_ref: |
   select 
   (select count(*) from rental
   where not return_date is null
   and (cast(JulianDay(return_date) as Integer)- CAST(JulianDay(rental_date) as Integer)) =1
   )*100.0/
   (select count(*) from rental
   );