category: [extra,aggregate,sqljoin]
database: sakila
question: 'What is the total revenue of film: SATURDAY LAMBS?'
js_ref: |  
   var revenue=0.0;
   data.customers.map((customer) => {
      {
         customer.Rentals.map(rental=>{
            {
                  if (rental.Film_Title == "SATURDAY LAMBS")
                  {
                     revenue+=rental.Payments.reduce((total,actual)=>{return total+actual.Amount},0.0)
                  }
            }
         })
      }
   });
   result=revenue;
sql_ref: |
   select sum(payment.amount) as revenue
   from 
   payment join 
   rental on rental.rental_id=payment.rental_id join
   inventory on inventory.inventory_id = rental.inventory_id join
   film on inventory.film_id=film.film_id
   where film.title='SATURDAY LAMBS'
  