category: [extra,filter,projection]
database: sakila
question:  Which film was returned the latest?
js_ref: |  
   var max_time=0.0;
   var film_titles=[]
   var maxd=''
   data.customers.map((customer) => {
      customer.Rentals.map(rental=>{
          {
              var rt=rental.Return_Date;
              var ru=rental.Rental_Date;
              if (rt>'' && rt>maxd)
              { 
                  film_titles=[rental.Film_Title];
                  maxd=rt;
              }
              else if (rt>'' && rt==maxd)
              { 
                film_titles.push(rental.Film_Title);
              }
          }
      })
   });
   result=film_titles         
sql_ref: |
   select film.title
   from rental
   join inventory on inventory.inventory_id=rental.inventory_id
   join film on film.film_id=inventory.film_id
   where rental.return_date=(
   select max(Return_Date)
   from rental
   )