category: [aggregate,groupby]
database: sakila
question: I need a table with the mean number of custumers per week day.
js_ref: |  
      let result={};
      data.customers.map(customer=>{
         customer.Rentals.map(rental=>{
            let date = new Date(rental.Rental_Date);
            let week_day=date.getDay();
            if (!(week_day in result)) {
               result[week_day]=0;  
            }
            result[week_day]+=1;
         });
      });
            
sql_ref: |
   select STRFTIME('%w', rental.rental_date) as weekday, count(*) total_rent from rental
   group by STRFTIME('%w', rental.rental_date)
