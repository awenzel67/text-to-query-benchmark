category: [extra,aggregate,join,complex]
database: sakila
question: 'Which customers rented film: JEEPERS WEDDING'
js_ref: |  
   var revenue=0.0;
   var customers_m={}
   data.customers.map((customer) => {
      {
         customer.Rentals.map(rental=>{
            {
                  if (rental.Film_Title == "JEEPERS WEDDING")
                  {
                     revenue+=1.0;
                     let ft=customer.First_Name+ " "+ customer.Last_Name;
                     customers_m[ft]=1
                  }
            }
         })
      }
   });
   let result=Object.keys(customers_m);
sql_ref: |
  select distinct CONCAT(customer.first_name,' ',customer.last_name) customer_name
   from 
   customer join 
   rental on rental.customer_id=customer.customer_id join
   inventory on inventory.inventory_id = rental.inventory_id join
   film on inventory.film_id=film.film_id
   where film.title='JEEPERS WEDDING'
  