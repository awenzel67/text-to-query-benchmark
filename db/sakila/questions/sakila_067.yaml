question: For each day of the week, compute the total number of rentals.
js_ref: |        
      var weekdayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      let result={};
      var date_costumers={}
      var dc2={}
      data.customers.map(customer=>{
         customer.Rentals.map(rental=>{
            let date = new Date(rental.Rental_Date);
            date.setHours(0,0,0,0)
            if (!(date in date_costumers)) {
               date_costumers[date]=0;  
            }
            date_costumers[date]+=1;
         });
      });

      
      for (const d in date_costumers)
      {
             
            let date = new Date(d);
            let nco=  date_costumers[d]
            date.setHours(0,0,0,0)
            let week_day=date.getDay();
            let week_day_name=weekdayNames[week_day]
            if (!(week_day_name in result)) {
               result[week_day_name]=[];  
            }
            result[week_day_name].push(nco);
      }


      for (const d in result){
               result[d] = result[d].reduce((sum, num) => sum + num, 0); 
      }      
sql_ref: |
   select weekday,sum(total_rent)
   from (
   select date(rental_date) as date, STRFTIME('%w', rental.rental_date) as weekday, count(*) as total_rent from rental
   group by date(rental_date)
   )
   group by weekday
