category: [variant,aggregate,complex]
database: sakila
question: Generate a table showing the  monthly rental count and monthly revenue, grouped by month across all years in the database.
js_ref: |  
      let result={};
      var monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'];
      data.customers.map(customer=>{
         customer.Rentals.map(rental=>{
            let date = new Date(rental.Rental_Date);
            let month_year=date.getMonth();
            if (!(month_year in result)) {
               result[month_year]={"rental":0,"revenue":0,"month":monthNames[month_year]};  
            }
            let initialValue=0.0
            let amount=rental.Payments.reduce((accumulator, currentValue) => accumulator + currentValue.Amount,initialValue)
            result[month_year]["rental"]=result[month_year]["rental"]+1;
            result[month_year]["revenue"]=result[month_year]["revenue"]+amount;
         });
      });
      result=Object.values(result)
            
sql_ref: |
   select 
   STRFTIME('%m', rental.rental_date) as month,
   count(distinct rental.rental_id) as rentals,
   sum(payment.amount) as revenue
   from rental join
   payment on payment.rental_id=rental.rental_id 
   group by STRFTIME('%m', rental.rental_date)