question: What is the mean rental duration??
js_ref: |  
    let numbers=data.films.map(film=>{
          return film.Rental_Duration;
       }
    );
    const sum = numbers.reduce((acc, num) => acc + num, 0);
    let result=sum / numbers.length;
sql_ref: |
    select avg(rental_duration) from film;    