category: [extra,aggregate,sqljoin]
database: sakila
question: Give me a table with the number of rentals and film duration for each film.
js_ref: |
      let result=[];
      let filmCountRental=new Map();
      let filmName=new Map();
      data.customers.map(customer=>{
         customer.Rentals.map(rental=>{
            if (rental.filmId) {
               if (!(rental.filmId in filmCountRental)) {
                  filmCountRental[rental.filmId]=0;
               }
               filmCountRental[rental.filmId]+=1;
               filmName[rental.filmId]=rental.Film_Title;
            }
         });
      });
      duration_films=new Map();
      data.films.map(film=>{
            duration_films[film.filmId]=film.Length
      });
      for (const filmId in duration_films) {
            var count=0;
            if (filmId in filmCountRental)
            {
               count=filmCountRental[filmId]
            }
            else
            {
               count=0;
            }
            result.push({
            "length":duration_films[filmId], 
            "count":count});
      }
sql_ref: |
  select 
  Length ,
  (select count(*) 
  from rental join
  inventory on rental.inventory_id=inventory.inventory_id
  where 
  film.film_id=inventory.film_id
  ) as count
  from 
  film;
