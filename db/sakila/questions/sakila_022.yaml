category: [filter,projection,sqljoin]
database: sakila
question: I need the full name (first and last) and address of all store managers.

js_ref: |  
      let result=data.stores.map(
      store => {
         return {
            "name":store.Manager_First_Name + " "+ store.Manager_Last_Name,
            "address":store.Address
         }
      }
      )     
            
sql_ref: |
   select address.address,
   concat(staff.first_name,' ',staff.last_name) as name
   from store join
   address on store.address_id=address.address_id join
   staff on staff.store_id=store.store_id