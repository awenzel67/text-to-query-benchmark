js_ref: "\nvar result=data.employees.filter(\nemployee => {\n  return employee.profile.projects.some(\
  \ \n     project => {\n         return project.tasks.some(task => {\n          \
  \  return task.assignedTo.skills.experience.certifications.meta && task.assignedTo.skills.experience.certifications.meta.lastUpdated>\"\
  2025-08-01\";\n        });\n     } \n  ) \n}\n).map(employee => (employee.name)\n\
  \    )\n"
question: Which employees has a certificate updated after 2025-08-01
sql_ref: select distinct employees.name from employees join profile on employees_id=employees.Id
  join projects on profile_id=profile.id join tasks on projects_id=projects.id join
  assignedTo on tasks_id=tasks.id join skills on assignedTo_id=assignedTo.id join
  experience on skills_id = skills.Id  join certifications on experience_id=experience.id
  join meta on certifications_id=certifications.id where lastUpdated>'2025-08-01'
