database: company
js_ref: "\nvar result=data.employees.filter(\nemployee => {\n  return employee.profile.projects.some(\
  \ \n     project => {\n         return project.tasks.some(task => {\n          \
  \  return task.assignedTo.skills && task.assignedTo.skills.primary === \"JavaScript\"\
  ;\n        });\n     } \n  )\n}\n).map(employee => (employee.name)\n    )\n"
question: Which employee has JavaScript as primary skill in their project?
sql_ref: select employees.name from employees join profile on employees_id=employees.Id
  join projects on profile_id=profile.id join tasks on projects_id=projects.id join
  assignedTo on tasks_id=tasks.id join skills on assignedTo_id=assignedTo.id where
  skills."primary"='JavaScript'
