question: What are the job responsibilities assigned to team member Tommy Parker?
sql_ref: select tasks.description from employees join profile on employees_id=employees.Id
  join projects on profile_id=profile.id join tasks on projects_id=projects.id where
  employees.name='Tommy Parker'
