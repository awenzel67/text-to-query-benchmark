js_ref: "\nvar result=data.employees.filter(\nemployee => {\n  return employee.profile.projects.some(\
  \ \n     project => {\n         return project.tasks.some(task => {\n          \
  \  return task.assignedTo.skills && task.assignedTo.skills.primary === \"C++\" &&\
  \ \n             task.assignedTo.skills && task.assignedTo.skills.experience.years\
  \ > 4\n        });\n     } \n  )\n}\n).map(employee => ({\n    id: employee.id,\n\
  \    name: employee.name\n    })\n    )\n"
question: Wich employee has primary skills in C++ and more then 4 years experience?
sql_ref: select name  from employees where id in (select employees.id from  meta join
  certifications on certifications_id=certifications.id join experience on experience_id=experience.id
  join skills on skills_id=skills.id join assignedTo on assignedTo_id=assignedTo.id
  join tasks on tasks_id=tasks.id join projects on  projects_id= projects.id join
  profile on profile_id=profile.Id join employees on  employees_id=employees.id where
  skills."primary"='C++' and years>4)
