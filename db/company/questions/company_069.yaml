question: What is the count of skills listed for each staff member?
sql_ref: select name,count(*) as count from( select employees.name, skills."primary"  as
  skill from employees join profile on employees_id=employees.Id join projects on
  profile_id=profile.id join tasks on projects_id=projects.id join assignedTo on tasks_id=tasks.id
  join skills on assignedTo_id=assignedTo.id union select employees.name, secondary.value
  as skill from employees join profile on employees_id=employees.Id join projects
  on profile_id=profile.id join tasks on projects_id=projects.id join assignedTo on
  tasks_id=tasks.id join skills on assignedTo_id=assignedTo.id join secondary on skills_id
  =skills.id) group by name
