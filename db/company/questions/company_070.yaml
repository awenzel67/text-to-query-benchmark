js_ref: "\nvar result=data.employees.filter(employee => {\n          return employee.profile.projects.some(\
  \ \n             project => {\n                 return project.tasks.some(task =>\
  \ {\n                  if (task.assignedTo.skills.primary=='Docker'){\n        \
  \             return true;\n                  }\n                  if (task.assignedTo.skills.secondary.includes('Docker')){\n\
  \                     return true;\n                  }\n                  return\
  \ false;\n                }) &&\n                project.tasks.some(task => {\n\
  \                   return task.assignedTo.skills.experience.domains && \n     \
  \              task.assignedTo.skills.experience.domains.some( domain => { return\
  \ domain == \"DevOps\"});\n                });\n          });\n    }).map(employee\
  \ => {\n       return {\n         \"id\": employee.id,\n         \"name\": employee.name\n\
  \       }\n    })   \n"
question: Which employees possess the skill 'Docker' along with experience in the
  DevOps field? Provide their IDs and names.
sql_ref: select employees.id, employees.name from employees join profile on employees_id=employees.Id
  join projects on profile_id=profile.id join tasks on projects_id=projects.id join
  assignedTo on tasks_id=tasks.id join skills on assignedTo_id=assignedTo.id join
  secondary on skills_id =skills.id where  (secondary.value='Docker' or skills."primary"='Docker')
  and exists( select * from  experience join domains on experience_id=experience.id  where
  experience.skills_id=skills.id  and domains.value='DevOps')
