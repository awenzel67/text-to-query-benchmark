database: company
js_ref: "\nvar result=data.employees.filter(\nemployee => {\n  return Number(employee.profile.contact.address.location.geo.lat)>50.0;\n\
  }\n).map(employee => (employee.name)\n    )\n"
question: "Which employees live north of 50\xB0?"
sql_ref: select employees.name  from employees join profile on employees_id=employees.Id
  join contact on profile_id=profile.id join address on contact_id=contact.Id join
  location on address_id=address.Id join geo on location_id=location.Id where CAST(geo.lat
  as REAL) >50
