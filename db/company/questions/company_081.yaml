database: company
js_ref: "\n\nvar result=data.employees.filter(\nemployee => {\n  return employee.profile.contact.address.location.state=='TX';\n\
  }\n).map(employee => (\n{\n    id: employee.id,\n    name: employee.name,\n    })\n\
  )\n"
question: 'Wich employees live in the State Texas id: TX'
sql_ref: select  employees.name, employees.id from location join address on address_id=address.id
  join contact on contact_id=contact.id join profile on profile_id=profile.id join
  employees on employees_id=employees.id where state='TX'
