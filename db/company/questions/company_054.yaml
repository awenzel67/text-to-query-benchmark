js_ref: "\n      var result=data.employees.filter(\nemployee => {\n  return employee.name=='Sara\
  \ Rivera';\n}\n).map(employee => ({\n    street: employee.profile.contact.address.street,\n\
  \    city: employee.profile.contact.address.city\n    })\n    )\n"
question: What is the contact information for staff member Sara Rivera?
sql_ref: select street, city from employees join profile on employees_id=employees.Id
  join contact on profile_id=profile.id join address on contact_id=contact.Id where
  employees.name='Sara Rivera'
