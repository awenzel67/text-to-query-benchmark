question: Which city has the highest concentration of workers residing in them?
sql_ref: select city from (select address.city, count(*) as count from employees join
  profile on employees_id=employees.Id join contact on profile_id=profile.id join
  address on contact_id=contact.Id group by address.city order by count desc limit
  1)
